# Antigravity. Every flag is from `agy --help` (1.5.14).
version: 1
label: Antigravity
provider: Google

# agy records the last conversation id for each exact directory path in
# this JSON object. herdr reports no id, and the transcript names no
# directory, so the dispatcher pins the id on a live pass, never after
# the session ends. Its first timed line must be at or after the launch's
# start floored to a second, so a record an earlier session left is no
# match. Crews verify the launch-specific first prompt in that
# transcript's first USER_INPUT, since multiple panes can open
# conversations in the same directory. Context reads only the pinned
# transcript. An unpinned session has no reading.
session:
  home: .gemini/antigravity-cli
  glob: brain/{session}/.system_generated/logs/transcript.jsonl
  index:
    file: cache/last_conversations.json
    field: .
    at: created_at

# Context use is the last PLANNER_RESPONSE line's input and cache-read
# tokens, which add up to what the session holds: input excludes the cache
# (the cache reaches ~500k while input stays a few thousand), and their sum
# climbs to each compaction. CHECKPOINT clears the reading: any counts it
# holds are for the compaction call, and bare /compact can stop there. In
# agy 1.5.17 transcripts the first response after counted checkpoints used
# 12,142–29,071 input and cache-read tokens. Recent responses name the model,
# and none names the window; each group below names the primary source its
# windows come from. A missing or unknown model gives no reading: the
# orchestrator ids name none, since no source states the window of their
# planner/executor pairing. A crew that needs handoff before auto-compaction
# sets AGY_CLI_AUTO_COMPACT_OVERRIDE above the handoff threshold for its window.
context:
  type: PLANNER_RESPONSE
  reset_type: CHECKPOINT
  usage: .
  tokens: [input_tokens, cache_read_tokens]
  model_field: model
  model_windows:
    # The CLI status line docs: 1,048,576.
    gemini-4-argon-low: 1048576
    gemini-4-argon-medium: 1048576
    gemini-4-argon-high: 1048576
    # DeepMind's Carbon and Hydrogen model cards: 1M.
    gemini-4-carbon-low: 1048576
    gemini-4-carbon-medium: 1048576
    gemini-4-carbon-high: 1048576
    gemini-4-hydrogen-low: 1048576
    gemini-4-hydrogen-medium: 1048576
    gemini-4-hydrogen-high: 1048576
    gemini-4-hydrogen-xhigh: 1048576
    # The Antigravity model guide: up to 512K in Antigravity.
    gemini-4-neon-low: 524288
    gemini-4-neon-medium: 524288
    gemini-4-neon-high: 524288
    gemini-4-neon-xhigh: 524288
    # Google Cloud's Gemini 3.8 Flash developer's guide: 1,048,576.
    gemini-3.8-flash-low: 1048576
    gemini-3.8-flash-medium: 1048576
    gemini-3.8-flash-high: 1048576
    # Anthropic's models overview: a 1M-token window.
    claude-opus-5-5-low: 1000000
    claude-opus-5-5-medium: 1000000
    claude-opus-5-5-high: 1000000
    claude-sonnet-5-5-low: 1000000
    claude-sonnet-5-5-medium: 1000000
    claude-sonnet-5-5-high: 1000000
    # OpenAI's API model docs: a 131,072 context window.
    gpt-oss-120b-medium: 131072

# agy asks whether a folder is trusted the first time it is started in
# it: yardr answers it (internal/runner/trust.go). The dialog is its
# question, the answer the one that accepts it, as agy 1.5.14 prints
# them, read 2026-11-21 under a pty in a scratch directory:
#
#   Accessing workspace:
#
#   /private/tmp/agy-scratch1
#
#   Do you trust the contents of this project?
#
#   Antigravity CLI requires permission to read, edit, and execute files here.
#
#   > Yes, I trust this folder
#     No, exit
#
#     ↑/↓ Navigate · enter Confirm
#
# The dialog opens with its cursor on the accepting answer. Answering it
# leaves agy's own trust record for agy to write: the directory in
# trustedWorkspaces in ~/.gemini/antigravity-cli/settings.json, one entry
# per folder, and no hand adds one there. `agy --help` names no flag or
# setting that skips the question.
trust:
  dialog: "Do you trust the contents of this project?"
  answers: ["Yes, I trust this folder"]
  cursor: ">"

# agy's input is a bare line begun with >, between two rules (read live,
# agy 1.5.14, 21 Nov 2026):
#
#   ────────────────────────────────────────
#   > Auto mode: edits & safe commands auto-approved (shift+tab to cycle)
#   ────────────────────────────────────────
#   ? for shortcuts                      auto · Gemini 4 Neon · medium
#
# An empty input shows the mode's hint in gray (SGR 90, not faint), so
# without the `placeholder` field it would read as text someone left.
# The hint's words depend on the mode (--mode
# accept-edits|auto|plan); only auto's are named, the default a session
# starts in, so in another mode an empty input reads as text someone left
# until the hint's colour can be named instead
# (placeholder_sgr reads 38;2 and 38;5, and SGR 90 is neither). A message
# it took stays above with the same mark. Before its own messages agy
# draws ┃ (a notice, with "esc to dismiss") or └ (a tip); its answers
# carry no mark, and an unknown command is one plain line. The rest taken
# off an error line is what any TUI may draw.
marks:
  input: ">"
  message: ">"
  placeholder: "Auto mode: edits & safe commands auto-approved (shift+tab to cycle)"
  error: "└┃⏺⎿●■•▌│✗✘⚠!"

# The one stop seen (21 Nov 2026, a pane herdr kept calling working):
# "⚠ Individual quota reached. Please upgrade your subscription to
# increase your limits. Resets in 2h15m47s." The ⚠ is one of
# marks.error, taken off before a pattern is tried, and the words after
# "Resets in" are the reset the daemon reads where no limits source
# names one (internal/dispatch/harness.go: lineReset). No other agy
# error line has been seen, so no other is listed.
errors:
  - reason: rate_limited
    pattern: '^Individual quota reached'

flags:
  model: --model
  # `agy --help` (1.5.14, 21 Nov 2026): "--effort  Reasoning effort for
  # the current session (low|medium|high|xhigh|max)". A group's effort=
  # becomes these words after its own arguments.
  effort:
    args: [--effort, "{level}"]
    levels: [low, medium, high, xhigh, max]
  # No unattended: agy's modes (--mode accept-edits|auto|plan) are session
  # behaviour, not a permission level, so none stands for it. The default
  # auto mode already auto-approves edits and safe commands; everything
  # without asking is the preset below.
  version: [--version]
  # `agy -p "<prompt>"` answers one prompt and exits: run 21 Nov 2026,
  # `agy -p "reply with exactly this word: ok"` printed `ok`, status 0.
  one_shot: [-p]
  permissions:
    - label: always approve
      args: [--dangerously-skip-permissions]
      description: auto-approves all tool permission requests without prompting
