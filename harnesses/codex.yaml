# Codex. Every flag is from `codex --help`.
version: 1
label: Codex
provider: OpenAI
install: npm install -g @openai/codex

# On a Mac without a terminal (docs/doctor.md, "A program fetched on a Mac").
# Codex's README names these archives for a Mac: "Each archive contains a
# single entry with the platform baked into the name ..., so you likely want
# to rename it to `codex` after extracting it." ~/.local/bin is where
# OpenAI's own installer (https://chatgpt.com/codex/install.sh) puts codex.
# The sha256 below are the digests https://releases.openai.com/codex/channels/latest
# gave for 0.162.1 on 2026-10-13, and GitHub's for the same release's
# assets; both binaries are signed by Developer ID Application: OpenAI OpCo,
# LLC (2DC432GLL2). The arm64 one was run (`--version`) on macOS 26.5.1 in
# an empty home. OpenAI's installer takes a larger archive than this one
# (codex-package-*, with rg and helpers beside codex): this is the README's
# binary alone. Its `--help` has `codex update`, which was not run.
fetch:
  verified:
    from: https://github.com/openai/codex/blob/main/README.md
    on: 2026-10-13
  version: 0.162.1
  path: ~/.local/bin/codex
  targets:
    darwin/arm64:
      url: https://releases.openai.com/codex/releases/0.162.1/codex-aarch64-apple-darwin.tar.gz
      sha256: b293a0fcdd871900a44c0a4f40a1aa401b31e02854f790ebdb8bd5d1177fd1fe
      size: 98104184
      member: codex-aarch64-apple-darwin
    darwin/amd64:
      url: https://releases.openai.com/codex/releases/0.162.1/codex-x86_64-apple-darwin.tar.gz
      sha256: d68e39d8f62639f33f7d00656554cb9c3ef7809e664a3827e62ab3ace3c21b21
      size: 107055460
      member: codex-x86_64-apple-darwin

# Codex asks whether a folder is trusted the first time it is started in
# it: yardr answers it (internal/runner/trust.go). The dialog is its
# question, the answer the one that accepts it, as codex-cli 0.160.1
# prints them, read 2026-10-15 from a review session's pane. Codex trusts
# by git repository root, so one answer covers the depot; answering the
# dialog leaves Codex's own trust record for Codex to write, and no hand
# adds a line to ~/.codex/config.toml.
trust:
  dialog: "Trust this folder?"
  answers: ["1. Trust and continue"]
  cursor: "›"

# Codex begins a message it took with the mark of its input. Before a
# message of its own it draws ■ or •; the other marks are a box's edge and
# what any TUI may draw before an error.
marks:
  input: "›"
  message: "›"
  error: "⏺⎿●■•▌│┃✗✘⚠!"

flags:
  model: --model
  # Codex takes its reasoning effort as the setting model_reasoning_effort,
  # which -c sets for one run over ~/.codex/config.toml. It checks no level
  # itself: `codex exec -c model_reasoning_effort=bogus` (codex-cli 0.160.1,
  # 10 Nov 2026) starts, prints "reasoning effort: bogus" and fails at its
  # first request. The levels are the ones `codex debug models` lists, read
  # the same day: the union over its models, of which some take low to ultra
  # and others low to max. A level the group's model does not take fails at
  # the session's first request, as a model the account may not use does.
  effort:
    args: [-c, "model_reasoning_effort={level}"]
    levels: [low, medium, high, xhigh, max, ultra]
  unattended: [--dangerously-bypass-approvals-and-sandbox]
  version: [--version]
  # What the real one says, as for claude: run on 2 Nov 2026, codex-cli
  # 0.160.1, `codex --version` printed
  #   codex-cli 0.160.1
  version_contains: codex-cli
  # codex exec refuses to run outside a git repository without
  # --skip-git-repo-check.
  one_shot: [exec, --skip-git-repo-check]
  # Codex otherwise runs its shell commands in one background server shared
  # by all of the user's Codex sessions, with the environment of the session
  # that started it: every later session's yardr commands would name that
  # first session as actor and session, and descend from no pane the store
  # knows. --no-daemon makes a session run without it, even one that is
  # already running.
  #
  # Codex checks for a release of itself when it starts, and upgrades in its
  # own pane before it draws its screen (`brew upgrade --cask codex`, for
  # minutes): a session must not change the machine's software at start,
  # whatever the operator's ~/.codex/config.toml says. `-c key=value` in one
  # word, so that a group's own `-c` does not pass for it.
  always: [--no-daemon, --config=check_for_update_on_startup=false]
  permissions:
    - label: approve for me
      args: [--approve-for-me]
      description: automatic review inside a workspace-write sandbox
    - label: bypass
      args: [--dangerously-bypass-approvals-and-sandbox]
      description: never asks, no sandbox
    # For an agent that reads what a stranger wrote. Inside the sandbox
    # nothing is written but one private directory, and nothing reaches the
    # network or a unix socket but the yard's, which every yardr command of
    # the session goes through: {socket} is the socket's path and {tmpdir}
    # the directory's, both put in by the runner.
    #
    # The directory is there for the shell. It makes a temporary file for a
    # here-document, so a sandbox that writes nowhere refuses the quoted
    # heredoc a note is written through (`yardr bead note <id> - <<'NOTE'`),
    # the form that keeps a backtick in a review from being run. The runner
    # makes the directory for the session (mode 0700, beside the worktrees),
    # sets TMPDIR and TMPPREFIX, which zsh makes that file from, to it, and
    # removes it when the session ends. The profile names it by its path and
    # never as :tmpdir, which follows whatever TMPDIR the process has and,
    # with the operator's own, is the user's shared temporary directory. A
    # write anywhere else is refused, and so is one through a symlink or a
    # hard link in the directory, and a rename into it. macOS's own sh and
    # bash (3.2) make the file of a here-document in /var/tmp whatever TMPDIR
    # says, so they are still refused; Codex runs its commands in the login
    # shell, which is zsh there.
    #
    # --sandbox read-only has no way to name a socket, so this is a
    # permissions profile of its own that extends Codex's :read-only. A
    # profile's unix_sockets are let through only where its network is on
    # and goes through Codex's network proxy (the feature network_proxy,
    # which Codex 0.160.1 calls experimental): with no domain allowed the
    # proxy refuses every host. Without the feature the same profile opens
    # the whole network and every socket, so the feature is turned on with
    # --enable, which a Codex that no longer knows it refuses to start on.
    # Run against 0.160.1 (codex sandbox), the writes too.
    - label: read only
      args:
        - --enable
        - network_proxy
        - -c
        - 'default_permissions="yardr_read_only"'
        - -c
        - 'permissions.yardr_read_only.extends=":read-only"'
        - -c
        - permissions.yardr_read_only.network.enabled=true
        - -c
        - 'permissions.yardr_read_only.network.unix_sockets={"{socket}"="allow"}'
        - -c
        - 'permissions.yardr_read_only.filesystem={"{tmpdir}"="write"}'
      description: reads in a read-only sandbox, writes only to a private temporary directory, no network but the yard's socket; asks for anything else; needs Codex's network_proxy feature

# The models to pick from: gpt-6-luna is what recent Codex session files
# report, and gpt-6-astra is the live default in ~/.codex/config.toml, both
# read on 2026-10-15. `codex --help` names no models for --model, only
# "Model the agent should use" (codex-cli 0.160.1).
offers:
  - model: gpt-6-luna
    label: GPT-6 Luna
    recommended: yardmaster
  - model: gpt-6-astra
    label: GPT-6 Astra

# The model of the first turn_context.
model:
  home: .codex
  home_env: CODEX_HOME
  glob: sessions/*/*/*/rollout-*-{session}.jsonl
  type: turn_context
  field: payload.model

# What a session used, in tokens, read from the same file once the session has
# ended (docs/design/2026-10-21-yardr-qbqq-session-tokens.md, section 3.3).
# Read on 22 Oct 2026 from the review session of yardr-mnc8 (session
# 01a16016-6d55-7af1-bfc0-b359420f61be), a file of codex-cli 0.160.1. Each
# token_count line carries total_token_usage, the running total of the
# session, and last_token_usage for the call just made, so the last line is the
# total at any moment and none at the end is waited for: that finished file's 76
# last_token_usage values add up to its last total, 11,714,314 input (11,487,872
# of it cached) and 45,824 output. input_tokens includes cached_input_tokens
# (total_tokens is input plus output, 11,760,138 on the last line), so
# cache_in_input derives the fresh input from it, 226,442 on the last line, and
# the input itself stays as Codex reports it; reasoning_output_tokens is part of
# output_tokens and is not added. A token_count with no info and the
# token_usage_record lines, which have no payload.type, hold no total and are
# passed over.
usage:
  - type_field: payload.type
    type: token_count
    usage: payload.info.total_token_usage
    at: timestamp
    input: input_tokens
    cache_in_input: true
    cache_read: cached_input_tokens
    cache_write: cache_write_input_tokens
    output: output_tokens

errors:
  - reason: at_capacity
    pattern: '^(Selected model is at capacity|Flex capacity unavailable)'
  - reason: rate_limited
    pattern: '^You.ve hit your usage limit'
  - reason: rate_limited
    pattern: '^exceeded retry limit, last status: 429'
  - reason: not_logged_in
    pattern: '^(Not logged in|Sign in with ChatGPT)'
  - reason: not_logged_in
    pattern: '^Your (access token|authentication session) could not be refreshed'
  - reason: not_logged_in
    pattern: 'Please (log out and )?sign in again\.'
  - reason: not_logged_in
    pattern: '^(exceeded retry limit, last status: 401|unexpected status 401)'
  - reason: other
    pattern: '^Quota exceeded'
  - reason: other
    pattern: '^(stream error: )?stream disconnected before completion'
  - reason: other
    pattern: '^(exceeded retry limit|unexpected status \d)'

# Codex offers to switch to its cheaper model once a usage window reaches
# 90% (codex-rs/tui/src/chatwidget/rate_limits.rs,
# open_rate_limit_switch_prompt, read in 0.160.1, the version installed
# here, identical on main): the menu stays until it is answered, so it is
# still up after the reset, holding the pane's input, and the resume nudge
# is held behind it (yardr-dzjx). As its test snapshot draws it
# (rate_limit_switch_prompt_popup.snap):
#
#    Approaching rate limits
#    Switch to gpt-6-luna for lower credit usage?
#
#    › 1. Switch to gpt-6-luna
#      2. Keep current model
#      3. Keep current model (never show again)
#
# yardr declines it with Esc (internal/runner/herdr_screen.go): the prompt
# is a picker with no cancel action, so Esc dismisses it without choosing:
# the session keeps its model and nothing is persisted. The first option
# would switch the model, which yardr never selects; a session found on
# another model stays session_model_mismatch's to report.
dialogs:
  - dialog: rate_limit_switch
    pattern: '^Approaching rate limits'
  - dialog: rate_limit_switch
    pattern: '^Switch to gpt-6-luna for lower credit usage\?'
