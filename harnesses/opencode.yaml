# opencode. Every flag is from `opencode --help`.
version: 1
label: opencode
# No provider: its README names no maker, only the OpenCode team.
install: https://opencode.ai

flags:
  # No model flag: the interactive command takes none in 2.x (2.3.2 prints
  # its help and exits on --model, issue 41), so a group of this kind takes
  # no model= and 1.x's flag goes unserved.
  version: [--version]
  one_shot: [run]
  permissions:
    - label: auto
      args: [--auto]
      description: auto-approves anything not explicitly denied
