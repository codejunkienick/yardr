# Linear as a declared source, from the sketch
# (origin/sketch/source-in-a-pack:docs/design/source-in-a-pack/linear-pack):
# how the core verifies a Linear delivery, and the command that turns a
# verified body into the envelope; what the yard does in a Linear thread,
# by one command per thing; and Linear's issue URLs as a bead's link.
# internal/hooks holds it to golden files: the envelopes for the bodies
# its tests have, and what the stand-in receives for reply (with files
# too), posted, read, open and state.
#
# The name is linear: the pack is what yardr knows of Linear.
#
# A command is a list, run without a shell. A path that does not start
# with / is a file beside this one, which `yardr source add` copies into
# the yard.
name: linear
about: Linear issues and comments. Hears its webhooks and speaks in its threads.

# The name of the variable, never the value. A command gets it in its
# environment under this name, and gets no other variable of the yard.
# hook.normalize is handed no credential at all. Where the env sets the
# mint's two names, the core runs the source's mint_command and hands what
# it mints under LINEAR_API_KEY instead; one of them alone is refused.
#
# The header is how a declared call, one of the calls below, sends it.
# Without one those calls go out with no credential at all. Linear takes
# an OAuth access token as a Bearer token, and the yard's own is an OAuth
# application's token, so Bearer is the form here. Linear's authentication
# docs, at linear.app/developers/graphql, show a personal API key sent
# bare, as "Authorization: <API_KEY>", and do not say that Bearer takes one
# too. A declared call therefore wants an OAuth token. linear/thread builds
# its own header, a lin_api_ key bare and anything else as Bearer, and
# takes either.
#
# A credential that expires is minted, not kept: LINEAR_CLIENT_ID names
# the application (a public identifier, no secret), and linear-mint, the
# file beside this one, turns it with LINEAR_CLIENT_SECRET into an
# app-actor token at Linear's token endpoint: run with {inputs, scope} on
# stdin for a {token, expires_at}. The pack brings it
# (credential.mint_command), so applying the pack sets the mint with no
# command typed; the card shows its sha256, and a mint_command the
# operator sets on linear wins over it. The token is handed to each call
# under LINEAR_API_KEY, and kept in memory alone.
credential:
  env: LINEAR_API_KEY
  header: "Authorization: Bearer {credential}"
  mint:
    - name: LINEAR_CLIENT_ID
      secret: false               # a public identifier, asked in the clear
    - LINEAR_CLIENT_SECRET
  mint_command: [linear-mint]       # the file beside this one; the source's own mint_command wins

# ---- what it sends us ----------------------------------------------------

hook:
  # Adapter.Verify stays data, checked by the core: the signing secret is
  # handed to no command, and an unverified body reaches none.
  verify:
    scheme: hmac-sha256
    signed: body
    signature: { header: Linear-Signature, encoding: hex }
    delivery:  { header: Linear-Delivery }
    timestamp: { body: webhookTimestamp, unit: ms, window: 1m }
  bodies: unique
  # Linear's deliveries follow issue activity, not a rhythm, so silence is never quiet.
  untimed: true

  # Adapter.Normalize. stdin {"headers":{…},"body":{…}}, stdout the
  # envelope. The core sets source and delivery itself.
  normalize: [linear/normalize]

  # The keys its events' fields may carry: a subscription's --where may
  # name them beside type, action, team, project, repo and label. sender
  # is the Linear user id of who did it, the field the hear key below
  # matches. delegate and assignee are the Linear user ids the issue is
  # handed to, changed the fields an update changed, and state the type
  # of the state the issue is in after the event, so a hook line can
  # match an assignment and a move to Done.
  keys: [team, project, label, sender, delegate, assignee, changed, state]

# ---- who is heard ---------------------------------------------------------
# A delivery is kept with its speaker named where the sender is a user of
# the yard, matched by identity: fields.sender holds the Linear user id,
# which normalize also sets as actor.id. The core adds fields.speaker for
# a kept delivery (the yard user's name, or outside where the hook's
# --unknown word allows an unmapped sender); speaker is the derived
# filter key for this hear, and stands in no hook.keys above, which names
# only what normalize may set.

hear:
  field: sender
  by: identity

# ---- what the yard does in its threads ------------------------------------
# One command per thing, each handed its object on stdin and the
# credential under LINEAR_API_KEY, with YARDR_SOURCE_BASE from base below.
# linear/thread is the sketch's script: reply posts the body's comment with
# the key as its own id, posted finds what a key left ({} for none), read
# lists the thread's messages oldest first, open starts an issue in the
# team in, opened finds what an open left ({} for none: posted's sibling
# for open), and state moves to what the word means: exactly, or never
# backwards with forward (a stage map's move). The shapes are in
# docs/integrations.md.
#
# files says replies take files. Each is uploaded to Linear's storage, by
# fileUpload (the file's type, its own name and its size; Linear answers a
# signed address and the headers its PUT must carry) and then that PUT, and
# one comment is posted: the words first, then each file, a PNG or JPEG as
# an image and any other as a link under its name. A picture is what the
# bytes say it is (file(1) reads the type, never the name's ending), so a
# GIF or an SVG is a link. A file is at most the yard's blob_max_bytes and
# 8 MiB, whichever is lower, and every file is checked before any is
# uploaded, so one over the limit uploads nothing. That file, or an upload
# Linear refuses, fails the whole reply with no comment, and the error says
# the HTTP status and nothing more: Linear's answer holds the signed
# address, a secret as the token is, and neither goes in an argument, an
# output or a log. The PUT carries the file's type, the Cache-Control that
# Linear's upload guide sets and the headers Linear names, never the token,
# and follows no redirect. The yard's 30 seconds for a command are
# for every upload and the comment together. A retry is the core's: the
# same words and files are the same key, and the core asks posted for the
# key before it asks reply. A comment posted whose answer was lost is found,
# and nothing is uploaded or posted again; a comment never posted is posted
# once by the retry, which uploads every file again, and what the first
# attempt uploaded stays in the workspace, referenced by nothing.

thread:
  reply:  [linear/thread, reply]      # in  {thread, parent, body, key, files?} out {id, url}
  posted: [linear/thread, posted]     # in  {thread, key}                    out {id, url} or {}
  read:   [linear/thread, read]       # in  {thread}                         out {messages: [...]}
  place:  team                        # what open's in names
  open:   [linear/thread, open]       # in  {in, title, body, key, assignee?} out {id, title, url}
  assignee: id                        # the assignee open takes: a user's id
  opened: [linear/thread, opened]     # in  {in, key}                        out {id, title, url} or {}
  state:  [linear/thread, state]      # in  {thread, state, forward?}        out {status, moved, was?}
  states: [started, review, done]     # the words it has a status for
  files: true                         # replies take files: reply's in gains files: [paths]

# ---- its issues as a bead's link ------------------------------------------
# The host its issue URLs are on, what reads an issue from a URL's path,
# and over the groups: the issue's one fixed form, and the id a thread
# command takes for it.

link:
  host: linear.app
  issue: '^/([^/]+)/issue/([A-Z][A-Z0-9]*-[0-9]+)'
  fixed: "https://linear.app/{1}/issue/{2}"
  thread: "{2}"

# ---- (today) what an agent may ask of it, through `yardr call` ------------
# Unchanged, and separate from the above: declared HTTPS requests, granted
# one by one. A command is never something an agent calls.
#
# comment and read-comments are what an exec group is granted: comment posts
# one top-level comment with the key as its own id, as thread.reply does,
# and read-comments reads one issue's newest comments for the claim stage's
# copy of a change request's words. Neither selects nor names errors: a
# select would drop the top-level errors GraphQL rides beside data on HTTP
# 200, which the scripts need beside success, and a non-2xx stays
# status-only, the mint rule. The key is validated as a UUID and refused
# otherwise; Linear takes it as the comment's id in UUID v4 format (the
# scripts derive a v4-shaped one), and the same key twice posts once. The
# issue is the identifier form from the bead's tracks link (YRD-12), which
# both commentCreate.issueId and issue(id:) take besides a UUID. The body
# is a markdown String Linear caps nowhere the docs say, so the call's own
# 65536 characters refuse an over-long body, never cut one. The read's
# first:50 is the newest page (Linear lists first: newest-first) with
# hasNextPage saying whether older ones follow; totalCount stands on no
# connection but the search payloads, so it is not asked for. Its 262144
# bytes above the 64KB default follow the google-docs reads.

base: https://api.linear.app
calls:
  viewer:
    kind: read
    request: { method: POST, path: /graphql, body: { query: "{ viewer { id name } }" } }
  comment:
    kind: update
    about: Post one top-level comment on an issue, with the key as its own id
    params:
      issue: { type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]+$", max: 64, log: true }
      body: { type: string, max: 65536 }
      key: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", max: 36 }
    request:
      method: POST
      path: /graphql
      body: {
        query: "mutation($input: CommentCreateInput!) { commentCreate(input: $input) { success comment { id url } } }",
        variables: { input: { id: "{key}", issueId: "{issue}", body: "{body}" } },
      }
  read-comments:
    kind: read
    about: Read one issue's newest comments, one page of 50
    params:
      issue: { type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]+$", max: 64, log: true }
    request:
      method: POST
      path: /graphql
      body: {
        query: "query($id: String!) { issue(id: $id) { comments(first: 50) { nodes { id body createdAt url user { id name } botActor { id name } parent { id } } pageInfo { hasNextPage } } } }",
        variables: { id: "{issue}" },
      }
    answer: { max: 262144 }
check: viewer
