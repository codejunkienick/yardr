# Google Docs as a declared source: a document read, appended to at the
# end with several styled paragraphs in one call, replaced in place with a
# guarded find, given one picture where a placeholder stands, and laid out
# with a table where a placeholder stands and styled text. One source per
# host, so Docs is its own; the empty file it fills is made by the drive
# source's doc call. No other batchUpdate request is declared.
#
# Checked against the discovery document
# (https://www.googleapis.com/discovery/v1/apis/docs/v1/rest) on 16
# October 2026: documents.get answers the document with title and body;
# documents.batchUpdate takes {requests} and answers {documentId,
# replies}. InsertText takes endOfSegmentLocation, which appends at the
# end of the body with no index; UpdateParagraphStyle takes a range, a
# paragraphStyle with namedStyleType (NORMAL_TEXT, TITLE, HEADING_1
# through HEADING_6) and fields, and styles the paragraphs the range
# overlaps. Indices are UTF-16 code units, so an astral character counts
# double; the write call's build script reads the document for its body's
# end index, works out each paragraph's range itself, and prints the
# batchUpdate that appends them. ReplaceAllText, checked on 17 October
# 2026, takes containsText with text and matchCase, and replaceText, and
# answers occurrencesChanged in its reply; the replace call's build
# script reads the document for its text, counts the matches itself, and
# refuses more than one unless all is true. InsertInlineImage, checked on
# 12 November 2026 (discovery revision 20261106), takes a uri, an optional
# objectSize whose one given dimension keeps the picture's ratio, and
# either a location (an index, and a tabId) or an endOfSegmentLocation,
# which is the end of the body or of a header or footer; the uri must be
# publicly accessible, at most 2 kB, and a PNG, JPEG or GIF under 50 MB
# and 25 megapixels. documents.batchUpdate lists the documents scope
# among its own, so the scope this pack asks for covers it. The image
# call's build script finds the one place its placeholder stands, as the
# replace call counts, and prints a deleteContentRange of the placeholder
# and an insertInlineImage at its index, pinned to the revision read; with
# no placeholder it prints one insertInlineImage at the end of the body and
# reads nothing. InsertTable, checked on 12 November 2026 (discovery
# revision 20261106), takes rows, columns and a location, and puts the
# table one index past it, a newline before it. A table and its cells'
# texts take two batchUpdates: an insertion index past a table inserted in
# the same batch is shifted past it, so the cells cannot be filled in the
# one that places it. The table call's build script reads the document,
# sends the place itself (a deleteContentRange of the placeholder and an
# insertTable at its start, pinned to the revision read), reads again for
# the new revision and to see the table where it put it, and prints the
# fill: an insertText per non-empty cell from the last cell backwards, and
# with borders=false one updateTableCellStyle taking every border away.
# UpdateTextStyle, UpdateParagraphStyle and UpdateTableCellStyle, checked
# the same day, take a range with a textStyle (bold, fontSize,
# foregroundColor) or a paragraphStyle (alignment) and fields, and the
# table's start with a tableCellStyle and fields; a border of width 0 is
# hidden. The style call's build script finds the one match of its text,
# in a table cell too, and prints the one batchUpdate styling it, pinned
# to the revision read; align styles the paragraph the match's range
# overlaps, which is the match's own, since a match holds no line break.
#
# The credential mints like google-mail's: GOOGLE_ACCOUNT names the
# account (an address, no secret) and google-mint, beside this file,
# mints from it, which the operator's own mint_command wins over. Docs
# takes no idempotency key, so the file names none: a write tried again
# after a lost answer is appended twice. A replace tried again counts
# again first, so it sends a second change only where the first left
# matches. An image tried again after a lost answer is placed twice at the
# end of the body; at a placeholder it finds none the second time, which it
# refuses, the placeholder being gone. A table tried again after a lost
# answer finds its placeholder gone too, which it refuses; where the place
# landed and the fill did not, the empty table stands to be removed by
# hand. A style tried again styles again, to the same end.
name: google-docs
about: Google Docs read and appended to, several styled paragraphs in one call, replaced in place, given a picture, and laid out with a table and styled text.
base: https://docs.googleapis.com
credential:
  env: GOOGLE_TOKEN
  header: "Authorization: Bearer {credential}"
  mint:
    - name: GOOGLE_ACCOUNT
      secret: false               # an address, asked in the clear
  mint_command: [google-mint]       # the file beside this one; the source's own mint_command wins
calls:
  doc:
    kind: read
    about: Read one document, title and text
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
    request:
      method: GET
      path: /v1/documents/{docId}
    answer: { select: [title, body], max: 262144 }   # the text is in body's paragraphs
  write:
    kind: update
    about: Append paragraphs at the end, each with its style
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # One JSON array of text/style pairs, the paragraphs to append:
      # [{"text":"Lunch places","style":"HEADING_1"}]. Each style is one
      # of NORMAL_TEXT, TITLE, HEADING_1, HEADING_2; NORMAL_TEXT writes
      # plain. Free text: its value is in no event. The build script
      # reads the document for its body's end index, works out each
      # paragraph's range itself, and prints the batchUpdate; the first
      # pair continues the doc's last paragraph, so on a doc with text
      # it styles that paragraph whole.
      paragraphs: { type: string, max: 60000 }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-write]
    answer: { select: [documentId, replies] }
  replace:
    kind: update
    about: Replace text in place, refusing more than one match unless told all
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # The text to find, literal and case-sensitive; empty is refused by
      # the build script before the document is read. Free text: its value
      # is in no event.
      find: { type: string, max: 1000 }
      # The text that takes its place; empty deletes. Free text: its value
      # is in no event.
      with: { type: string, max: 60000 }
      # Left out, more than one match is refused in words that say the
      # count; true replaces them all. The build script reads the
      # document for its text, counts itself, and prints the batchUpdate,
      # pinned to the revision read; zero matches sends, and the answer's
      # occurrencesChanged of 0 says so.
      all: { type: bool, optional: true }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-replace]
    answer: { select: [documentId, replies] }   # replies carry replaceAllText.occurrencesChanged
  image:
    kind: update
    about: Place one picture where a placeholder stands, or at the end of the body; its uri must be a public https address, which Google fetches itself
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # Where Google fetches the picture from: https only, public (no login,
      # so no file on this machine and no private Drive file), a PNG, JPEG
      # or GIF under 50 MB and 25 megapixels, at most 2 kB of address. The
      # build script refuses an address that is no https one in words that
      # say why. Free text: its value is in no event, since a signed address
      # carries its signature.
      uri: { type: string, max: 2000 }
      # The placeholder text to put the picture in the place of: literal and
      # case-sensitive, in the body of the document (not in a header, a
      # footer or a footnote), one line, matching exactly one place; the
      # text is removed and the picture takes its place. Left out, the
      # picture goes at the end of the body (the first tab's), in its last
      # paragraph. Free text: its value is in no event.
      find: { type: string, max: 1000, optional: true }
      # The picture's width in points, 72 to an inch; its height follows the
      # picture's own ratio. Left out, Google sizes the picture from its
      # resolution, which for a large one may be wider than the page.
      width: { type: int, optional: true }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-image]
    answer: { select: [documentId, replies] }   # replies carry insertInlineImage.objectId
  table:
    kind: update
    about: Put a table where a placeholder stands and fill its cells, with or without borders
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # The placeholder text to put the table in the place of: literal and
      # case-sensitive, in the body of the document (not in a header, a
      # footer or a footnote), one line, matching exactly one place; the
      # text is removed and the table takes its place. The placeholder's
      # paragraph is split around the table. Free text: its value is in no
      # event.
      find: { type: string, max: 1000 }
      # The table's rows as one JSON array of rows, each an array of
      # strings: [["Item","CHF"],["Bread","1.20"]]. Every row holds the
      # same number of cells: at most 20 rows of 6, each cell's text a few
      # lines at most. A cell's text may itself be a placeholder that
      # replace fills later. Free text: its value is in no event.
      cells: { type: string, max: 60000 }
      # Left out or true, the table keeps its borders; false takes them
      # all away, for a block of columns side by side.
      borders: { type: bool, optional: true }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-table]
    answer: { select: [documentId, replies] }   # replies carry one per cell filled
  style:
    kind: update
    about: Style one match bold, sized or coloured, or align the paragraph it stands in
    params:
      docId: { type: string, pattern: "^[A-Za-z0-9_-]+$", max: 200, log: true }
      # The text to style: literal and case-sensitive, in the body of the
      # document (not in a header, a footer or a footnote), table cells
      # included, one line, matching exactly one place. Free text: its
      # value is in no event.
      find: { type: string, max: 1000 }
      # True bolds the match; false removes bold; left out leaves it as it is.
      bold: { type: bool, optional: true }
      # The match's size in whole points, above 0.
      size: { type: int, optional: true }
      # The match's colour as six hex digits, such as 808080. Free text:
      # its value is in no event.
      color: { type: string, max: 6, optional: true }
      # The alignment of the paragraph the match stands in.
      align: { type: enum, values: [left, center, right], optional: true }
    request:
      method: POST
      path: /v1/documents/{docId}:batchUpdate
    build: [google-docs/build-style]
    answer: { select: [documentId, replies] }
