# Contributors pack for yardr: a public repository's issues and pull requests
# from outside, as beads. Everything a maintainer chooses is here: the
# stages, the labels, who is trusted, what an outside pull request may do.
# yardr itself only knows that an event may MAKE a bead, SAY an outcome to
# the bead that tracks its thread, and that a stage HEARS back to the source.
# Like the starter pack it names no agent product, model, depot, person,
# repository or secret: the import asks, and they stay in the yard. The
# format is the starter's (packs/starter/pack.yaml, docs/packs.md).

name: contributors

# The kind of depot the pack is for: an accepted issue is built on a branch
# and landed on a base, and a pull request is a repository's.
kind: git

# Two flows, each for one type of bead, beside the flow the depot follows for
# its own work (the starter's, say): this pack has none without a type.
flows:
  # An issue from outside: a maintainer looks first. Accepted, it is a bead
  # like any other, on the starter flow's stages from backlog on.
  #
  # A close on GitHub is the decision, made by someone who may close that
  # repository's issues, and ends the bead wherever it waits: every open
  # stage has an edge for dropped, or a close past triage would find no
  # edge and a builder might keep working a bead for a closed issue.
  issue:
    type: issue
    stages:
      triage:   { group: maintainers, file: flows/issue/triage.md, outcomes: { accepted: backlog, dropped: closed }, manual: [backlog, closed] }
      backlog:  { group: backlog,     outcomes: { dropped: closed }, manual: [new, decide] }
      new:      { group: builders,    outcomes: { done: review, question: decide, dropped: closed }, manual: [backlog] }
      review:   { group: reviewers,   outcomes: { done: approved, changes: new, question: decide, dropped: closed } }
      approved: { group: assembly,    outcomes: { done: merged, failed: new, question: decide, dropped: closed } }
      decide:   { group: decisions,   file: flows/issue/decide.md, outcomes: { dropped: closed }, manual: [backlog, new] }
      merged:   { end: true }
      closed:   { end: true }

  # A pull request from outside: a maintainer looks, a reviewer that only
  # reads reviews it, the yard posts that review on the pull request, the yard
  # runs the depot's tests on its head, the contributor answers on GitHub, a
  # maintainer merges on GitHub, or the yard does for one marked merge-ok (the
  # exec group of the importing yard's own, which the pack does not carry:
  # docs/line.md, "Merging pull requests"). A reviewed pull request with
  # findings is fixed by a builder on the head its maintainer picked and
  # pushed back onto its branch by the yard's script (fix, push), and returns
  # for a fresh accept of the new head. Nothing of it runs on the yard's
  # machine until a reviewer has read it, and then only the depot's tests, in
  # ciwait, and the fix on the head that was read. A maintainer's yes is of
  # one commit: new commits on a pull request they accepted take its bead back
  # to triage, and the tests run only at the commit that was accepted.
  #
  # What became of the pull request is the source's word, and it can come
  # while its bead waits in triage, review, review-post, ciwait, contributor
  # or decide: a maintainer merges on GitHub without waiting for the yard, or
  # the author closes it. Each of those stages has an edge for merged and for
  # dropped, as approved does, or the bead would stay open on a pull request
  # that is over.
  pr:
    type: pr
    stages:
      # Where a maintainer decides, on the bead's card in Decide or by the label
      # (flows/pr/triage.md). pushed is the source's word, as in review below:
      # new commits while the bead waits here make the stay again, so that the
      # card of the head it was put for is taken back and the card of the head
      # the pull request has now is put. The yes a card gives is of the head it
      # shows, so a pick of the old card accepts nothing.
      triage:      { group: maintainers,  file: flows/pr/triage.md,   outcomes: { accepted: review, dropped: closed, merged: merged, pushed: triage }, manual: [review, closed] }
      # pushed is the source's word, never the reviewer's: a bot pushed while
      # the pull request was read, so the bead stays and is read again, as a
      # new stay, at the new head (the says table has the line). So is
      # unaccepted: new commits on a pull request a maintainer accepted are a
      # head nobody accepted, and the bead goes back to triage, from here and
      # from review-post, ciwait and contributor, to be looked at again before
      # the new head is read or run. outdated is the source's word too: a
      # person pushed to a pull request no maintainer accepted while it was
      # read, and the bead waits for its contributor, as it did before the
      # reviewer's changes went through the posting (a bead that has stored no
      # review has nothing to post).
      review:      { group: pr-reviewers, file: flows/pr/review.md,   outcomes: { done: review-post, changes: review-post, question: decide, pushed: review, unaccepted: triage, outdated: contributor, merged: merged, dropped: closed } }
      # The reviewer holds no key, so its review is data: it stores the review
      # on the bead with the head it read, and a script of the yard, post-review,
      # posts it on the pull request as the yard's GitHub App and sends the bead
      # on the way the review says: the tests, or the contributor. Always a
      # comment, never an approval or a request for changes, since merging is a
      # maintainer's and nothing posts again when the contributor acts. A question
      # is not posted. A review that cannot be posted as stored (a field wrong,
      # a head that moved since) goes back to the reviewer once, then to a person.
      # The script runs as the bead arrives and is done in moments, but a push
      # that comes meanwhile is the source's word as it is under review: new
      # commits on a pull request a maintainer accepted (unaccepted) take the
      # bead back to triage, and a bot's rebase (pushed) back to review, so that
      # a head nobody accepted is not read before a person has said yes to it. A
      # person's push to a pull request no maintainer accepted has no line here:
      # the script's own check of the head fails the review of the old head back
      # to review, where the new head is read.
      review-post: { group: post,         file: flows/pr/review-post.md, outcomes: { done: ciwait, changes: contributor, failed: { to: review, max: 1, then: decide }, pushed: review, unaccepted: triage, merged: merged, dropped: closed } }
      # The yard's own CI: the depot's test command, run on the head the
      # reviewer read, by pr-ci, which says done or changes. Not the end of
      # review because the reviewer runs nothing, and the code runs only once
      # it has been read. A bot's push sends it back to review, to be read at
      # the new head. A merge or a close ends the bead, and the script's
      # report of a run that was of a pull request now over is refused, as
      # after a push, since the bead has left the stage.
      ciwait:      { group: pr-ci, file: flows/pr/ciwait.md, outcomes: { done: approved, changes: contributor, pushed: review, unaccepted: triage, merged: merged, dropped: closed } }
      # Waits for the pull request to change: nobody of the yard works it, and
      # a maintainer can still merge it on GitHub. A reviewed one with findings
      # is picked for a fix round by hand to fix, after it is labelled fix-ok
      # and the reviewed head recorded as fix_head (flows/pr/fix.md), and one
      # whose head only needs the tests run again is picked by hand to ciwait,
      # after it is labelled ci-ok (flows/pr/ciwait.md). The group has no
      # members: a stray move to fix holds at the push script, which checks the
      # pick, while the move to ciwait is refused without the label.
      contributor: { group: outside,      outcomes: { pushed: review, unaccepted: triage, dropped: closed, merged: merged }, manual: [fix, ciwait] }
      # A reviewed pull request with findings is fixed here, on the head its
      # maintainer picked. The builder holds no key and reads a stranger's text
      # as the reviewer does; its checkout is the picked head, detached, never
      # the live tip. What it commits is pushed by the next stage.
      fix:         { group: builders,     file: flows/pr/fix.md,   outcomes: { done: push, question: decide, merged: merged, dropped: closed } }
      # The yard pushes the fix onto the pull request's branch as its GitHub
      # App, waits for its own push to arrive as the bead's head, and sends the
      # bead back to triage for a fresh accept of the new head. A held push is
      # resumed by hand to triage, never straight back to push.
      push:        { group: push-fix,     file: flows/pr/push.md,  outcomes: { done: triage, merged: merged, dropped: closed }, manual: [triage] }
      # Back to ciwait by hand when the head moved after its run: the yard
      # merges only a head its CI passed on. A maintainer may also return an
      # approved bead to contributor before picking a fix of its reviewed head.
      approved:    { group: maintainers,  file: flows/pr/approved.md, outcomes: { merged: merged, dropped: closed }, manual: [merged, closed, ciwait, contributor] }
      # A reviewer's question waits here for a person, and the pull request can
      # be merged or closed on GitHub meanwhile: the bead ends with it, or it
      # would wait for an answer about a pull request that is over.
      # review-post is for a person to run the posting again, once the stored
      # review is put right after a second failure.
      decide:      { group: decisions,    file: flows/pr/decide.md, outcomes: { merged: merged, dropped: closed }, manual: [review, review-post, closed] }
      merged:      { end: true }
      closed:      { end: true }

# builders, reviewers, assembly, backlog and decisions are the starter's,
# with its roles and its script, so an accepted issue is worked as the
# depot's own beads are.
groups:
  builders:     { agent: roles/builder.md,     limit: 3 }
  reviewers:    { agent: roles/reviewer.md,    limit: 2 }
  # The role says read, never run. What keeps it to that is the sandbox of
  # its agent, which the import asks for with the agent (README.md).
  pr-reviewers: { agent: roles/pr-reviewer.md, limit: 1 }
  assembly:     { run: scripts/merge-local,    limit: 1 }
  # The yard's CI of a pull request (docs/line.md, "The yard as the CI of a
  # pull request"). It works as the yard's GitHub App, whose id and key file the
  # group's env_file gives and the import cannot ask for, so a yard sets the
  # group up first and maps it (--group pr-ci=pr-ci), once for all its depots.
  # One at a time: the machine's tests queue anyway.
  pr-ci:        { run: scripts/pr-ci,          limit: 1 }
  # The yard's posting of a reviewer's stored review on a pull request
  # (docs/line.md, "Posting a pull request's review"). It works as the yard's
  # GitHub App too, whose id and key file the group's env_file gives and the
  # import cannot ask for, so a yard sets the group up first and maps it
  # (--group post=yardr-post), once for all its depots; the public line's own
  # posting stages are routed to the same group. One at a time.
  post:         { run: scripts/post-review,    limit: 1 }
  # The yard's push of a fix onto a pull request's branch (flows/pr/push.md).
  # It works as the yard's GitHub App too, whose id and key file the group's
  # env_file gives and the import cannot ask for, so a yard sets the group up
  # first and maps it (--group push-fix=yardr-push), once for all its depots.
  # One at a time: pushes onto one branch queue anyway. No other stage routes
  # here, and no hand path leads into it: every push is a fix round's.
  push-fix:     { run: scripts/push-fix,       limit: 1 }
  # The import asks who.
  maintainers:  { people: true }
  backlog:      { people: true }
  decisions:    { people: true }
  # Nobody of the yard, so give it no members: a bead held here moves on an
  # event of the source, and shows a person where the pull request waits.
  outside:      { people: true }

crew:
  yardmaster:
    role: roles/yardmaster.md
    hears:
      events: [attention]
      stages: [triage, decide]
      done: true
    subscribe:
      github: involved

sources:
  github:
    # MAKES: an event about a thread no open bead tracks makes one, which
    # tracks the thread, so that later events find it. The first line an
    # event matches counts, so the trusted authors come first.
    makes:
      # Trust is a where: the pull request of someone the repository knows
      # skips the maintainer. association is GitHub's author_association as
      # the github source's normalize writes it, in lowercase, and a where
      # compares exactly: OWNER and MEMBER here would match no pull request.
      #
      # A reopened pull request (action=reopened) is judged by the same lines
      # as when it was opened. The close that ended its bead (see says, below)
      # left no open bead for the thread, so this makes the next one. It
      # starts clean. Nothing of the old bead's review or tests carries over,
      # because they were of a head the pull request may no longer have.
      # sender is whoever reopened it, just as it is whoever marked a pull
      # request ready for review.
      - { where: "event=pull_request action=opened action=ready_for_review action=reopened association=owner association=member", bead: { type: pr, stage: review } }
      # A bot's pull request skips the maintainer too: the dependency bumps of
      # the repository's tooling are the bulk of them, and the reviewer after
      # this stage reads what a maintainer would. sender is GitHub's kind of
      # what acted (user, bot or organization), never a login, so no line can
      # name one bot: every bot's pull request goes to review, and a human
      # from outside keeps the hold.
      - { where: "event=pull_request action=opened action=ready_for_review action=reopened sender=bot", bead: { type: pr, stage: review } }
      - { where: "event=pull_request action=opened action=ready_for_review action=reopened", bead: { type: pr, stage: triage } }
      # A reopened issue (action=reopened) is judged by the same line as
      # when it was opened. The close that ended its bead (see says, below)
      # left no open bead for the thread, so this makes the next one. It
      # starts clean.
      - { where: "event=issues action=opened action=reopened", bead: { type: issue, stage: triage } }

    # SAYS: an event reports an outcome to the bead that tracks its thread,
    # and the flow above routes it. A label is an outcome like any other.
    # Every line is for one type of bead (type=issue, type=pr). The yard has
    # one hook of the source, and the lines of another pack (the starter's,
    # for a train's pull request) stand in its table beside these: the import
    # sets only its own lines among them, and the type is what tells an event
    # about a pull request from one about a train, whichever pack came first.
    says:
      - { where: "event=issues action=labeled label=accepted type=issue", outcome: accepted }
      # A close ends the bead in any stage that holds an open one. The
      # stages are named so that the yard's own close when a bead is
      # merged (hears issue, below) finds the bead already terminal and
      # is refused quietly, as a close for a bead past deciding is.
      - { where: "event=issues action=closed stage=triage stage=backlog stage=new stage=review stage=approved stage=decide type=issue", outcome: dropped }
      # The yes is a person's: sender is a kind, as in makes, so the label put
      # by a bot (a workflow that sorts or sizes pull requests) is no
      # maintainer's. The yard records the head the event named as the bead's
      # accepted_head, which the tests run at and no other. A label is read as
      # the pull request carries it, so a bead that came back to triage
      # (below) is accepted again by a person's next label on a pull request
      # that still bears this one: taking it off and putting it on again is
      # the plain way.
      - { where: "event=pull_request action=labeled label=accepted sender=user type=pr", outcome: accepted }
      # New commits on a pull request that waited in triage are a head nobody
      # accepted, whoever pushed and wherever the bead waits: it goes back to
      # triage, and nothing of the new head is read or run until a person has
      # said yes again. The line catches a pull request that still bears the
      # label; the dispatcher also uses the bead's triage history when the
      # label was removed. This line comes before the trusted authors' and
      # bots' lines: the first line an event matches counts.
      - { where: "event=pull_request action=synchronize label=accepted stage=review stage=review-post stage=ciwait stage=contributor type=pr", outcome: unaccepted, note: "new commits since a maintainer accepted the PR" }
      # New commits while the bead waits in triage, whoever pushed, make the
      # stay again: the card there names the head it was put for, and the yes
      # it gives is of that head (see the stage file). Nothing of the new head is
      # read or run: the bead is where it was, with a card of the new head.
      - { where: "event=pull_request action=synchronize stage=triage type=pr", outcome: pushed, note: "new commits on the PR while it waited for a maintainer" }
      - { where: "event=pull_request action=synchronize stage=contributor type=pr", outcome: pushed, note: "new commits on the PR" }
      # A bot's push while the pull request is read, its review is posted or it
      # waits on CI starts the read again at its new head. A bot's rebase is the
      # only push it makes,
      # so a bead sent to contributor would wait there for one that never
      # comes. sender is a kind, as in makes, so this is every bot; a
      # person's push is the general lines below, and the first line an event
      # matches counts, so this one comes before them. A pull request a
      # maintainer accepted never gets here: its push is the line above.
      - { where: "event=pull_request action=synchronize sender=bot stage=review stage=review-post stage=ciwait type=pr", outcome: pushed, note: "a bot pushed to the PR" }
      - { where: "event=pull_request action=synchronize stage=review type=pr", outcome: outdated, note: "the PR changed under review" }
      # CI is the yard's own, run by pr-ci, which reports through the yard's
      # socket and not through a line of this table: no event of GitHub's CI
      # moves a bead. A push while the run is queued or running sends the pull
      # request back, since the run is of a head it no longer has: a bot's to
      # review (the line above), a person's to its contributor.
      - { where: "event=pull_request action=synchronize stage=ciwait type=pr", outcome: changes, note: "the PR changed while waiting on CI" }
      # The end of the pull request, wherever its bead waits: these name no
      # stage, and the flow above leads them out of triage, review,
      # review-post, ciwait, contributor, approved and decide.
      - { where: "event=pull_request action=closed merged=true type=pr", outcome: merged }
      - { where: "event=pull_request action=closed merged=false type=pr", outcome: dropped }

    # HEARS: a stage of the bead sets a status on the thread. GitHub has
    # open and closed, and labels (label:<name>). The thread only ever moves
    # forward, so what the yard sets never comes back as a move.
    #
    # Only issues are heard: no stage opens or closes a pull request (a label
    # is all a map gives one, docs/links.md), and the thread command refuses a
    # state asked of one. A pr bead that ends leaves its pull request as it is,
    # and a line for one would queue a move that fails and is tried again until
    # it is given up. A pull request ends on GitHub, merged or closed there,
    # and its bead follows (says, above).
    as: yardmaster
    hears:
      issue: { new: started, merged: done, closed: done }
